<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- FIX(控制台 404): 内联 SVG favicon，消除 /favicon.ico 404，无需新增二进制资源 -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23151a20'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23ff7a1a' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23ff7a1a'/%3E%3C/svg%3E"
    />
    <title>Urban Radar 流动餐车</title>
    <meta name="description" content="流动餐车 GPS 极速专送平台与黑曜石协同中枢，配备版本自愈清理与腾讯云端实时拉取数据引擎" />
    <meta property="og:title" content="Urban Radar 流动餐车" />
    <meta property="og:description" content="流动餐车 GPS 极速专送平台与黑曜石协同中枢，配备版本自愈清理与腾讯云端实时拉取数据引擎" />
    <script>
      // Global uncaught error guard for iframe preview stability & SDK key checks
      window.addEventListener('error', function(event) {
        var msg = event && event.message ? String(event.message) : '';
        if (
          !msg ||
          msg === 'Script error.' ||
          msg.indexOf('Script error') !== -1 ||
          msg.indexOf('INVALID_USER_KEY') !== -1 ||
          msg.indexOf('FlyDataAuthTask') !== -1 ||
          msg.indexOf('AMap') !== -1 ||
          msg.indexOf('_leaflet_pos') !== -1 ||
          msg.indexOf('initWebSocketConnection') !== -1 ||
          msg.indexOf('credentials not found') !== -1 ||
          msg.indexOf('wsclient.send timedout') !== -1
        ) {
          if (typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();
          if (typeof event.preventDefault === 'function') event.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && event.reason ? String(event.reason.message || event.reason) : '';
        if (
          !reason ||
          reason === 'Script error.' ||
          reason.indexOf('Script error') !== -1 ||
          reason.indexOf('INVALID_USER_KEY') !== -1 ||
          reason.indexOf('FlyDataAuthTask') !== -1 ||
          reason.indexOf('AMap') !== -1 ||
          reason.indexOf('_leaflet_pos') !== -1 ||
          reason.indexOf('initWebSocketConnection') !== -1 ||
          reason.indexOf('credentials not found') !== -1 ||
          reason.indexOf('wsclient.send timedout') !== -1
        ) {
          if (typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();
          if (typeof event.preventDefault === 'function') event.preventDefault();
          return true;
        }
      }, true);

      // 禁止 iOS Safari 捏合手势放大导致画面比例失真，锁定 1:1 视口
      document.addEventListener('gesturestart', function(e) {
        if (e.preventDefault) e.preventDefault();
      }, { passive: false });
    </script>

    <!-- Google Fonts: Space Grotesk, Manrope & Material Symbols (彻底剔除等宽字体) -->
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

    <!-- Leaflet 真实地图 (中国可达 CDN + 真实瓦片, 取代硬编码上海 SVG) -->
    <link
      rel="stylesheet"
      href="https://cdn.bootcdn.net/ajax/libs/leaflet/1.9.4/leaflet.min.css"
      crossorigin=""
    />
    <script
      src="https://cdn.bootcdn.net/ajax/libs/leaflet/1.9.4/leaflet.min.js"
      crossorigin=""
    ></script>
    <script>
      // Defensive protection against Leaflet unmounted marker / animation _leaflet_pos access
      (function() {
        if (typeof window !== 'undefined' && window.L && window.L.DomUtil) {
          var _origGetPos = window.L.DomUtil.getPosition;
          window.L.DomUtil.getPosition = function(el) {
            if (!el) return new window.L.Point(0, 0);
            try {
              return _origGetPos.call(window.L.DomUtil, el);
            } catch (e) {
              return (el && el._leaflet_pos) || new window.L.Point(0, 0);
            }
          };

          var _origSetPos = window.L.DomUtil.setPosition;
          window.L.DomUtil.setPosition = function(el, point) {
            if (!el) return;
            try {
              el._leaflet_pos = point;
              if (_origSetPos) _origSetPos.call(window.L.DomUtil, el, point);
            } catch (e) {}
          };
        }
      })();
    </script>
    <style>
      /* 避免 Leaflet 图片被 Tailwind 的 img{max-width:100%} 压缩变形 */
      .leaflet-container img { max-width: none !important; }
      .leaflet-container { background: #f9f9f7 !important; font-family: inherit; }
      .truck-pin { filter: drop-shadow(0 2px 3px rgba(0,0,0,0.35)); }
      /* 极简黑白平铺渲染滤镜：去除杂乱色与2D/3D立体建筑模型 */
      .minimal-flat-map-tile,
      .amap-clean-white-tile {
        filter: grayscale(100%) contrast(0.92) brightness(1.03) !important;
        opacity: 0.92 !important;
      }
    </style>
  </head>
  <body class="bg-white text-[#1a1c1b] antialiased selection:bg-neutral-900 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
